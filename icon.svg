<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Whale girl merged data card">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf5ff"/>
      <stop offset="1" stop-color="#c6e0ff"/>
    </linearGradient>
    <linearGradient id="hair" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4a8ade"/>
      <stop offset="1" stop-color="#23529f"/>
    </linearGradient>
    <linearGradient id="hair2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b78cc"/>
      <stop offset="1" stop-color="#1d478c"/>
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)"/>

  <!-- long hair silhouette -->
  <path d="M15.5 25.5c0-9 7-14.5 16.5-14.5S48.5 16.5 48.5 25.5c0 5.2-1.7 8.6-2.2 12.8-.5 4.4.6 9.4 3.1 13.4.5.8-.2 1.8-1.1 1.6-6.1-1.4-10.2-4.6-12.6-8.9-1.9.5-3.9.8-6.2.8s-4.3-.3-6.2-.8c-2.4 4.3-6.5 7.5-12.6 8.9-.9.2-1.6-.8-1.1-1.6 2.5-4 3.6-9 3.1-13.4-.5-4.2-2.2-7.6-2.2-12.8z" fill="url(#hair)"/>

  <!-- face -->
  <ellipse cx="32" cy="32.5" rx="12.6" ry="11.8" fill="#ffe6db"/>

  <!-- bangs over the forehead -->
  <path d="M19.6 28.4c.4-8.4 5.6-13.1 12.4-13.1s12 4.7 12.4 13.1c-2.3-3.6-5.4-5.6-8.7-4.6-2-3.2-5.4-3.2-7.4 0-3.3-1-6.4 1-8.7 4.6z" fill="url(#hair2)"/>

  <!-- white frilled headband -->
  <circle cx="24.6" cy="21.6" r="2.9" fill="#ffffff"/>
  <circle cx="31.4" cy="20.4" r="3" fill="#ffffff"/>
  <circle cx="38.2" cy="21.6" r="2.9" fill="#ffffff"/>
  <circle cx="43.6" cy="24.6" r="2.2" fill="#ffffff"/>
  <circle cx="20" cy="24.4" r="2.1" fill="#ffffff"/>

  <!-- eyes -->
  <ellipse cx="27" cy="33.6" rx="2.3" ry="3" fill="#22314a"/>
  <ellipse cx="37" cy="33.6" rx="2.3" ry="3" fill="#22314a"/>
  <circle cx="27.7" cy="32.4" r="0.95" fill="#ffffff"/>
  <circle cx="37.7" cy="32.4" r="0.95" fill="#ffffff"/>

  <!-- blush -->
  <ellipse cx="22.8" cy="38.6" rx="2.5" ry="1.5" fill="#ffb3b3" opacity="0.75"/>
  <ellipse cx="41.2" cy="38.6" rx="2.5" ry="1.5" fill="#ffb3b3" opacity="0.75"/>

  <!-- smile -->
  <path d="M30.4 39.6q1.6 1.7 3.2 0" fill="none" stroke="#c2544f" stroke-width="1.3" stroke-linecap="round"/>

  <!-- merged data bubble -->
  <g>
    <path d="M41.4 21.4l-2.2 5.2 5.2-2.9z" fill="#ffffff"/>
    <rect x="39.5" y="9.5" width="20.5" height="12.6" rx="6" fill="#ffffff" stroke="#cbe0f3" stroke-width="1"/>
    <circle cx="44.9" cy="15.7" r="1.8" fill="#22a06b"/>
    <rect x="48.1" y="14.2" width="8.3" height="2.7" rx="1.35" fill="#9fb4c9"/>
    <rect x="48.1" y="18" width="5.6" height="2.2" rx="1.1" fill="#d3dfea"/>
  </g>
</svg>
